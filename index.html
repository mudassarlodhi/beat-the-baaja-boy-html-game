<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Beat the Baaja Boy - Happy 79th Independence Day Pakistan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇵🇰</text></svg>">
  <meta property="og:title" content="Beat the Baaja Boy - Pakistan Independence Day Game">
  <meta property="og:description" content="Retro pixel-art game built in pure HTML5 Canvas. Raise the flag, silence the horns, dodge the JF-17.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="game-container">
    <header class="retro-header">
      <button id="sound-toggle">🔊 ON</button>
      <h1>HAPPY INDEPENDENCE DAY</h1>
      <p>PAKISTAN &bull; 14th AUGUST 2026</p>
    </header>

    <canvas id="stage"></canvas>

    <footer class="retro-footer">
      <p id="instruction-text">SLAP THE BAAJA BOY TO RAISE THE FLAG</p>
    </footer>
  </div>

  <!-- Welcome screen -->
  <div id="welcome-screen" class="screen-overlay">
    <h1>🇵🇰 BEAT THE 🇵🇰<br>BAAJA BOY</h1>
    <p>Silence street horns &amp; correct wheelie bikers.<br><span style="color:#FFD700;">WARNING:</span> Don't hit the Air Force Jets<br>Get the flag to the top to save Independence Day.</p>
    <p id="welcome-best" class="stat-line"></p>
    <button id="start-btn">START CELEBRATION</button>
  </div>

  <!-- End screen -->
  <div id="end-screen" class="screen-overlay hidden">
    <h1 id="end-title">INDEPENDENCE SAVED!</h1>
    <p id="end-time" class="stat-line"></p>
    <p id="end-slaps" class="stat-line"></p>
    <p id="end-best" class="stat-line"></p>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>
  <script src="./index.js"></script>
</body>
</html>
